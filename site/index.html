<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step 1 Interativo</title>
<meta name="description" content="Curso interativo baseado em questões para o USMLE Step 1: mecanismo antes do fato, testes o tempo todo e domínio por conceito.">
<meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Step 1">
<script>
  try {
    var s = JSON.parse(localStorage.getItem('step1-progress-v1') || '{}').settings || {};
    if (s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
    if (s.font) document.documentElement.style.setProperty('--font-scale', String(s.font));
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript>Ative o JavaScript para usar o curso.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
